name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Validate HTML
        run: npm run check:html

      - name: Serve _site on :8080
        run: npx http-server _site -p 8080 --silent &

      - name: Wait for server
        run: npx wait-on http://localhost:8080/index.html --timeout 30000

      - name: Accessibility audit (pa11y)
        run: npm run check:a11y
        continue-on-error: true

      - name: Lighthouse audit
        run: npm run check:lighthouse
        continue-on-error: true

      - name: Broken-link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # --base tells lychee how to resolve root-relative paths (/foo → _site/foo).
          # --offline skips external URL fetches (keeps CI deterministic).
          args: --no-progress --offline --base _site _site
          fail: false

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
