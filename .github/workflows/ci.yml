name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    # `labeled` so adding the `lighthouse` label re-runs the checks with it
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-check:
    name: Build & check
    runs-on: ubuntu-latest
    # One queue per branch, so PRs never wait on each other or on a
    # release. A newer push supersedes a running check, except on main,
    # whose run carries the deploy (#123).
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Validate HTML
        run: npm run check:html

      - name: Serve _site on :8080
        run: npx http-server _site -p 8080 --silent &

      - name: Wait for server
        run: npx wait-on http://localhost:8080/index.html --timeout 30000

      # Hard gates since v2.0.0 (2026-10-11, epic #34): every page passed
      # pa11y WCAG2AA and the Lighthouse budgets in .lighthouserc.json.
      - name: Accessibility audit (pa11y)
        run: npm run check:a11y

      # Lighthouse is slow (3 runs per URL), so it gates releases only:
      # every push to main, right before the deploy. On a PR, add the
      # `lighthouse` label to run it; or run the workflow by hand.
      - name: Lighthouse audit
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'lighthouse')
        run: npm run check:lighthouse

      - name: Broken-link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves root-relative paths (/foo → _site/foo); it
          # must be absolute (lychee 0.24 rejects a relative --base).
          # --offline skips external URL fetches (keeps CI deterministic).
          args: --no-progress --offline --root-dir ${{ github.workspace }}/_site _site
          fail: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-check
    runs-on: ubuntu-latest
    # Deploys never overlap or cancel each other
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
